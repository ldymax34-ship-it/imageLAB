<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- imagelab:entry -->
<title>半调网点 · 图像实验室 imageLAB</title>
<meta name="description" content="把本地图片做成 CMYK 四色半调、单色网点半调或有限色阶抖动，导出 PNG。图片只在浏览器里处理，不上传。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Crect x='7' y='7' width='8' height='8' fill='%23ffffff'/%3E%3Crect x='17' y='7' width='8' height='8' fill='%23ffffff'/%3E%3Crect x='7' y='17' width='8' height='8' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/backlink.css">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="../../assets/workspace.css">

<script type="module" src="./main.js"></script>
</head>
<body class="il-workspace" data-canvas="fill">
<a class="il-back" href="../../index.html">← 返回首页</a>

<header class="il-head">
  <h1>半调网点</h1>
  <p class="il-head-desc">
    三个效果：CMYK 四色半调、单色网点半调、有限色阶抖动。上传一张本地图片即可开始，图片只在浏览器里处理，不会上传。
  </p>
  <div class="il-head-status"><span id="status">初始化中…</span></div>
</header>

<main class="il-main">
  <!--
    悬浮检查器按「素材 / 效果 / 构图 / 输出」分类，只显示当前分类；控件由 ui.js 填进 #param-*。
    播放相关控件（播放 / 暂停、速度、帧、定格取帧）在画布下方的播放条。
  -->
  <aside class="il-panel" id="panel" data-catscope aria-label="参数分类">

    <div class="il-catnav" data-catnav role="tablist" aria-label="参数分类">
      <button type="button" class="il-cat" data-cat="media" id="cat-media" role="tab" aria-selected="false" aria-controls="panel-media" tabindex="-1">素材</button>
      <button type="button" class="il-cat" data-cat="effect" id="cat-effect" role="tab" aria-selected="true" aria-controls="panel-effect">效果</button>
      <button type="button" class="il-cat" data-cat="compose" id="cat-compose" role="tab" aria-selected="false" aria-controls="panel-compose" tabindex="-1">构图</button>
      <button type="button" class="il-cat" data-cat="output" id="cat-output" role="tab" aria-selected="false" aria-controls="panel-output" tabindex="-1">输出</button>
    </div>

    <section class="il-catpanel" data-catpanel="media" id="panel-media" role="tabpanel" aria-labelledby="cat-media" hidden>

      <section class="il-group" id="group-image">
        <h2 id="image-title">图片</h2>
        <p class="il-note" id="image-hint">上传本地 PNG / JPG / WebP。图片只在浏览器里解码，不会上传到任何地方。</p>
        <input type="file" id="image-file" accept="image/png,image/jpeg,image/webp,image/gif">
        <div class="il-image-slot" id="image-slot">
          <img class="il-thumb" id="image-thumb" alt="已上传图片预览" hidden>
          <button type="button" id="image-clear" hidden>清除图片</button>

        </div>
      </section>

    </section>

    <section class="il-catpanel" data-catpanel="effect" id="panel-effect" role="tabpanel" aria-labelledby="cat-effect">

      <section class="il-group">
        <h2>效果</h2>
        <p class="il-note" id="effect-note"></p>
        <div class="il-chips" id="effect-chips">
          <button type="button" id="effect-halftone-cmyk" data-effect="halftone-cmyk" aria-pressed="true">CMYK 半调</button>
          <button type="button" id="effect-halftone-dots" data-effect="halftone-dots" aria-pressed="false">网点半调</button>
          <button type="button" id="effect-image-dithering" data-effect="image-dithering" aria-pressed="false">图片抖动</button>
        </div>
      </section>

      <section class="il-group" id="group-presets" hidden>
        <h2 id="presets-title">预设</h2>
        <div class="il-chips" id="preset-chips"></div>
      </section>

      <section class="il-group" id="group-main">
        <h2>主要参数</h2>
        <div id="param-main"></div>
      </section>

    </section>

    <section class="il-catpanel" data-catpanel="compose" id="panel-compose" role="tabpanel" aria-labelledby="cat-compose" hidden>

      <details class="il-group" id="group-advanced" hidden>
        <summary id="advanced-title">进阶参数</summary>
        <div class="il-params" id="param-advanced"></div>
      </details>

      <details class="il-group" id="group-sizing">
        <summary>构图</summary>
        <div class="il-params" id="param-sizing"></div>
      </details>

    </section>

    <section class="il-catpanel" data-catpanel="output" id="panel-output" role="tabpanel" aria-labelledby="cat-output" hidden>

      <section class="il-group">
        <h2>输出</h2>
        <button type="button" id="btn-export">导出当前帧 PNG</button>
        <p class="il-note" id="export-info">导出的是预览区当前这一帧。</p>
      </section>

    </section>

  </aside>

  <section class="il-stagecol">
    <div class="il-stage">
      <div class="il-canvas" id="stage">
        <div class="il-empty" id="empty">
          <b>还没有图片</b>
          <span>在检查器的「素材」分类里选一张本地图片（PNG / JPG / WebP）就能看到半调效果。这里不会拿示例图冒充你的图片。</span>
        </div>
      </div>
    </div>
    <div class="il-playbar" data-playbar role="group" aria-label="播放控制">
      <div class="il-chips">
        <button type="button" id="btn-pause" title="停在当前画面">暂停</button>
        <button type="button" id="btn-play" title="继续播放动画">播放</button>
      </div>
      <div class="il-range">
        <label for="p-speed">速度</label>
        <input type="range" id="p-speed" min="0" max="4" step="0.05" value="1">
        <input type="number" id="n-speed" min="0" max="20" step="0.05" value="1">
      </div>
      <div class="il-range">
        <label for="p-frame">帧（毫秒）</label>
        <input type="range" id="p-frame" min="0" max="20000" step="50" value="0">
        <input type="number" id="n-frame" min="0" max="600000" step="50" value="0">
      </div>
      <div class="il-chips">
        <button type="button" id="btn-freeze" title="停到指定时间点，得到确定的单帧">定格取帧</button>
      </div>
      <p class="il-note" id="anim-note"></p>
    </div>
    <div class="il-legend">
      <span>本地处理 · 图片不上传 · 可导出 PNG</span>
    </div>
  </section>
</main>

</body>
</html>
