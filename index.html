<head>

<title>ImageLAB · 图像设计工具箱</title>
<meta name="description" content="ImageLAB 图像设计工具箱：内置工具在浏览器本地处理图片与素材，另有精选工具官网入口一键直达。">

<!-- 首屏只放字标：留白与横线负责结构，不放说明文字、按钮或数字徽标。 -->
<section class="hero" id="top">
  <div class="wrap">
    <h1 class="hero-mark">
      <img src="/brand/ImageLAB-logo-preview.png" alt="ImageLAB" width="1774" height="887" decoding="async">
    </h1>
  </div>
</section>

<div class="toolbar">
  <div class="wrap">
    <div class="filters" id="filters" role="group" aria-label="按类别筛选"></div>
    <div class="search">
      <input id="q" type="search" placeholder="搜索工具 / 关键词" aria-label="搜索工具" autocomplete="off">
    </div>
    <div class="count" id="count" aria-live="polite"></div>

</div>

<main id="sections"></main>

<footer>
  <div class="wrap">
    <div>ImageLAB · 本地图像设计工具集</div>
    <div>
      第三方来源与许可见 <a href="./THIRD_PARTY.md">THIRD_PARTY.md</a> ·
      入口与状态见 <a href="./README.md">README.md</a>

  </div>

</html>
